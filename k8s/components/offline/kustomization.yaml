# Proof for "restarts load the model locally, without the network": remove the only egress allow
# (HTTPS for the model download). With this component the vLLM pod can reach nothing but DNS.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: NetworkPolicy
      name: allow-model-fetch-egress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-model-fetch-egress
