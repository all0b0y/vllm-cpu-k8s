worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  # Read-only root filesystem: every temp path lives on the /tmp emptyDir.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;
  server_tokens off;

  # Access log: request metadata only. $uri has no query string; the body is never referenced.
  log_format meta escape=json '{"event":"proxy","ts":"$time_iso8601","request_id":"$rid","client":"$remote_addr",'
                              '"method":"$request_method","path":"$uri","status":$status,'
                              '"req_bytes":$request_length,"resp_bytes":$body_bytes_sent,'
                              '"rt_s":$request_time,"upstream_rt_s":"$upstream_response_time"}';
  map $http_x_request_id $rid {
    ""      $request_id;
    default $http_x_request_id;
  }
  access_log /dev/stdout meta;

  limit_conn_zone $binary_remote_addr zone=perclient:10m;

  upstream vllm {
    server 127.0.0.1:8000;      # vLLM listens on loopback only: unreachable except through this proxy
    keepalive 32;
  }

  server {
    listen 8080;

    # Prompt size limit; the buffer equals the limit so request bodies (prompts) never spill to disk.
    client_max_body_size    8m;
    client_body_buffer_size 8m;
    client_body_timeout     30s;
    limit_conn perclient 64;    # concurrent connections per client address (no requests/sec limit, see README)

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $rid;
    proxy_buffering off;        # streaming (SSE) must not be buffered, otherwise TTFT is meaningless
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;

    location = /health                { access_log off; proxy_pass http://vllm; }
    location = /metrics               { proxy_pass http://vllm; }
    location = /v1/models             { proxy_pass http://vllm; }
    location = /v1/chat/completions   { proxy_pass http://vllm; }
    location = /v1/completions        { proxy_pass http://vllm; }
    # Everything else (/invocations, /tokenize, /docs, /openapi.json, admin endpoints ...) is not exposed.
    location / { return 404; }
  }
}
