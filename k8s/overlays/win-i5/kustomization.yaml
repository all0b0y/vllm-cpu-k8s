# Intel i5-13400F (WSL2 VM 16 logical CPUs / 11 GB, minikube node 16 CPU, CPUs 0-1 reserved -> 14 allocatable).
# vLLM: 10 exclusive cores, 8 GiB.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - ../../base
components:
  - ../../components/edge-proxy
patches:
  # Strategic merge by container NAME: the edge-proxy component inserts nginx as containers[0], so an index-based
  # JSON patch (/containers/0) would resize nginx instead of vLLM.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vllm
      spec:
        template:
          spec:
            containers:
              - name: vllm
                resources:
                  requests: {cpu: "10", memory: 8Gi}
                  limits: {cpu: "10", memory: 8Gi}
