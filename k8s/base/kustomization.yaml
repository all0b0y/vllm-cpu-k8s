apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm

labels:
  - pairs:
      app.kubernetes.io/part-of: vllm-cpu
    includeSelectors: false

resources:
  - namespace.yaml
  - resources.yaml
  - deployment.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: vllm-config
    files:
      - config.yaml=config/vllm-config.yaml
  - name: vllm-env
    envs:
      - config/vllm.properties

# Real values live in gitignored files (create them with scripts/make-secrets.sh).
secretGenerator:
  - name: vllm-api-key
    files:
      - api-key=secrets/api-key.txt
    options:
      labels:
        app.kubernetes.io/component: api-key
  - name: hf-token
    files:
      - token=secrets/hf-token.txt
