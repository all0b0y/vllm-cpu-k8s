# MODEL_* are read by the model-fetch initContainer; the rest by vLLM / the guard middleware.
MODEL_ID=Qwen/Qwen2.5-1.5B-Instruct
MODEL_REVISION=989aa7980e4cf806f80c7fef2b1adb7bc71aa306
# CPU backend: bind one OpenMP thread per exclusive core, keep 1 core for the API server process.
VLLM_CPU_OMP_THREADS_BIND=auto
VLLM_CPU_NUM_OF_RESERVED_CPU=1
# Inductor compiles C++ kernels in a worker-process pool by default: one in-process compile thread
# keeps the warm-up memory spike inside the pod limit.
TORCHINDUCTOR_COMPILE_THREADS=1
# Guard middleware limits.
GUARD_MAX_TOKENS=2048
GUARD_MAX_N=4
GUARD_MAX_BODY_BYTES=8388608
